services:
  lab:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: code-lab:debian
    container_name: code-lab
    hostname: code-lab
    tty: true
    stdin_open: true
    init: true
    ports:
      # Port forwarding to loopback 127.0.0.1
      - "127.0.0.1:8081:8081"
    volumes:
      - ./workspace:/home/dev/workspace
      - nvim-data:/home/dev/.local/share/nvim
      - nvim-state:/home/dev/.local/state/nvim
    restart: unless-stopped

volumes:
  nvim-data:
  nvim-state:
